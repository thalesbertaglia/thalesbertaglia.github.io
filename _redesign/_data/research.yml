- title: Creator economy
  description: Studying content monetisation, influencer practices, advertising disclosures, and the incentives that shape creator behaviour across social media platforms.
- title: Platform governance
  description: Examining how platform design, data access, algorithmic systems, and regulation interact, particularly under European digital regulation.
- title: Online harms
  description: Developing and evaluating computational approaches for studying abusive language, toxicity, sexism, and fairness in content moderation.
- title: Computational methods for law and policy
  description: Translating legal and regulatory concepts into reproducible computational tasks while keeping their assumptions and limitations visible.

