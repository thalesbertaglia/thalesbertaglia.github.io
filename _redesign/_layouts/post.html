---
layout: default
---
<article class="shell article-shell">
  <header class="article-header">
    <p class="eyebrow">Writing · {{ page.date | date: '%d %B %Y' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-description">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose article-body">
    {{ content }}
  </div>
</article>
