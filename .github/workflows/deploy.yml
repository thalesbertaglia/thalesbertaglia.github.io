name: Build and deploy site

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/_redesign/Gemfile
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build --source _redesign --config _redesign/_config.yml --destination _site
      - name: Verify
        run: _redesign/script/verify _site production
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          args: --offline --root-dir ./_site './_site/**/*.html'
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: _site
