title: Thales Bertaglia
email: contact@thalesbertaglia.com
description: Research on how platforms and AI systems organise information and influence, and how these changing systems can be observed and measured.
url: https://thalesbertaglia.com
baseurl: ""
lang: en
timezone: Europe/Amsterdam

google_analytics: G-6BNSQF7PZW
lastfm_id: thalesbertaglia
linkedin_username: thales-bertaglia

permalink: /writing/:year/:month/:day/:title/

collections:
  updates:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-scholar
  - jekyll-sitemap

scholar:
  last_name: [Bertaglia]
  first_name: [Thales]
  style: apa
  locale: en
  source: _bibliography
  bibliography: papers.bib
  bibliography_template: bibliography
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - script
  - _templates
  - _archive
  - design-mockup.html
  - design-mockup-v2.html
  - design-mockup-v3.html
